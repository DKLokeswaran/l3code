name: l3code sync

# Keeps l3code `main` tracking pingdotgg/t3code `main` with a daily merge.
# A second job then merges `main` into `personal/main` (which kicks off the
# fork desktop build). Because `personal/main` is protected by required
# status checks, that merge lands through an auto-merging PR
# (`sync/personal-main-<date>`), not a direct push. The merge is
# all-or-nothing: on conflict it aborts and fails loudly, leaving
# `personal/main` untouched for a manual fix; if the checks fail, the PR
# stays open for a manual fix.

on:
  schedule:
    # 14:30 UTC (20:00 IST) crests the quiet window: sweeps up the full US
    # workday's output in one run so the desktop build stays fresh all day.
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # Open the sync PR and enable auto-merge on it.
  pull-requests: write
  # Needed to explicitly start the fork desktop build after the bot's own
  # push (bot pushes never cascade into other workflows by themselves).
  actions: write

concurrency:
  group: sync-fork-main
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream/main into main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream
        run: |
          set -euo pipefail
          git config user.name "l3code-sync[bot]"
          git config user.email "l3code-sync[bot]@users.noreply.github.com"
          git config merge.ours.driver true
          git remote add upstream https://github.com/pingdotgg/t3code.git 2>/dev/null || true
          git fetch upstream main --tags --prune
          head_sha="$(git rev-parse HEAD)"
          upstream_sha="$(git rev-parse upstream/main)"
          if test "$head_sha" = "$upstream_sha"; then
            echo "main already matches upstream/main ($head_sha)."
            exit 0
          fi
          base="$(git merge-base HEAD upstream/main)"
          if test "$base" = "$head_sha"; then
            git merge --ff-only upstream/main
            echo "Fast-forwarded main to $upstream_sha."
          else
            # main carries l3code-only commits (e.g. this workflow); merge instead.
            git merge --no-edit upstream/main
            echo "Merged upstream/main into main."
          fi
          # merge=ours cannot catch workflow files upstream ADDED (nothing
          # existed on our side to keep). Restore the whole directory to the
          # pre-merge state so the push never contains upstream workflow
          # changes the GitHub App token is not allowed to touch.
          if ! git diff --quiet ORIG_HEAD HEAD -- .github/workflows; then
            git rm -r -q --ignore-unmatch .github/workflows
            git checkout ORIG_HEAD -- .github/workflows
            git commit --amend --no-edit
            echo "Restored fork workflow files after upstream merge."
          fi

      - name: Push main
        run: git push origin HEAD:main

  merge-personal:
    name: Merge main into personal/main via auto-merging PR
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout personal/main
        uses: actions/checkout@v6
        with:
          ref: personal/main
          fetch-depth: 0

      - name: Merge main into personal/main
        id: merge
        run: |
          set -euo pipefail
          git config user.name "l3code-sync[bot]"
          git config user.email "l3code-sync[bot]@users.noreply.github.com"
          git fetch origin main personal/main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "personal/main already contains main. Nothing to do."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git merge --no-edit origin/main; then
            echo "Merged main into personal/main cleanly."
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Conflict merging main into personal/main. Aborted; personal/main left untouched. Resolve it manually."
            git merge --abort
            exit 1
          fi

      # personal/main requires status checks, so the merge cannot be pushed to
      # it directly. Push it to a throwaway branch and land it through a PR
      # that auto-merges once the required checks pass. A merge commit (not a
      # squash) preserves upstream history.
      - name: Open auto-merging PR into personal/main
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="sync/personal-main-$(date -u +%Y%m%d)"
          git push --force origin "HEAD:refs/heads/$branch"
          pr_number="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if test -n "$pr_number"; then
            echo "Reusing open PR #$pr_number for $branch."
          else
            pr_url="$(gh pr create \
              --base personal/main \
              --head "$branch" \
              --title "chore(sync): merge main into personal/main" \
              --body "Automated daily sync. Merges \`main\` into \`personal/main\` with a merge commit so upstream history is preserved. Auto-merges once the required status checks pass; stays open for a manual fix if they fail.")"
            pr_number="${pr_url##*/}"
          fi
          gh pr merge "$pr_number" --merge --auto

      # gh leaves the head branch behind when it enables auto-merge (it only
      # deletes on an immediate merge), so prune sync branches from earlier
      # runs whose PR is already merged or closed.
      - name: Prune old sync branches
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for stale in $(git ls-remote --heads origin 'refs/heads/sync/personal-main-*' | awk '{print $2}' | sed 's#refs/heads/##'); do
            if test -z "$(gh pr list --head "$stale" --state open --json number --jq '.[0].number // empty')"; then
              echo "Deleting stale branch $stale."
              git push origin --delete "$stale"
            fi
          done

      # A push to personal/main starts release-fork.yml. The auto-merge is
      # performed by GitHub, not this job, so it should fire from that push;
      # verify it after the first run and add an explicit dispatch if not.
