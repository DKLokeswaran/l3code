name: l3code sync

# Keeps l3code `main` tracking pingdotgg/t3code `main` with a daily merge.
# A second job then merges `main` into `personal/main` (which kicks off the
# fork desktop build). The merge is all-or-nothing: on conflict it aborts
# and fails loudly, leaving `personal/main` untouched for a manual fix.

on:
  schedule:
    # Off-peak minute values: GitHub's scheduler reliably drops crons on
    # round times like :00 and :30, so each entry uses an asymmetrical
    # minute and all three crest the quiet window (20:00-21:00 IST) that
    # sweeps up the full US workday. The guard job turns the redundancy
    # into "first success of the day runs, the rest skip".
    - cron: "17 14 * * *"
    - cron: "53 14 * * *"
    - cron: "29 15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # Needed to explicitly start the fork desktop build after the bot's own
  # push (bot pushes never cascade into other workflows by themselves).
  actions: write

concurrency:
  group: sync-fork-main
  cancel-in-progress: false

jobs:
  guard:
    name: Skip if a successful sync ran in the last 20 hours
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
    steps:
      - name: Check recent runs
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff="$(date -u -d '20 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          count="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/sync-fork-main.yml/runs?status=success&created=%3E$cutoff&per_page=1" --jq '.workflow_runs | length')"
          if test "$count" -ne 0; then
            echo "A successful sync ran within the last 20 hours. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  sync:
    name: Merge upstream/main into main
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream
        run: |
          set -euo pipefail
          git config user.name "l3code-sync[bot]"
          git config user.email "l3code-sync[bot]@users.noreply.github.com"
          git config merge.ours.driver true
          git remote add upstream https://github.com/pingdotgg/t3code.git 2>/dev/null || true
          git fetch upstream main --tags --prune
          head_sha="$(git rev-parse HEAD)"
          upstream_sha="$(git rev-parse upstream/main)"
          if test "$head_sha" = "$upstream_sha"; then
            echo "main already matches upstream/main ($head_sha)."
            exit 0
          fi
          base="$(git merge-base HEAD upstream/main)"
          if test "$base" = "$head_sha"; then
            git merge --ff-only upstream/main
            echo "Fast-forwarded main to $upstream_sha."
          else
            # main carries l3code-only commits (e.g. this workflow); merge instead.
            git merge --no-edit upstream/main
            echo "Merged upstream/main into main."
          fi
          # merge=ours cannot catch workflow files upstream ADDED (nothing
          # existed on our side to keep). Restore the whole directory to the
          # pre-merge state so the push never contains upstream workflow
          # changes the GitHub App token is not allowed to touch.
          if ! git diff --quiet ORIG_HEAD HEAD -- .github/workflows; then
            git rm -r -q --ignore-unmatch .github/workflows
            git checkout ORIG_HEAD -- .github/workflows
            git commit --amend --no-edit
            echo "Restored fork workflow files after upstream merge."
          fi

      - name: Push main
        run: git push origin HEAD:main

  merge-personal:
    name: Merge main into personal/main
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout personal/main
        uses: actions/checkout@v6
        with:
          ref: personal/main
          fetch-depth: 0

      - name: Merge main into personal/main
        id: merge
        run: |
          set -euo pipefail
          git config user.name "l3code-sync[bot]"
          git config user.email "l3code-sync[bot]@users.noreply.github.com"
          git fetch origin main personal/main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "personal/main already contains main. Nothing to do."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git merge --no-edit origin/main; then
            echo "Merged main into personal/main cleanly."
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Conflict merging main into personal/main. Aborted; personal/main left untouched. Resolve it manually."
            git merge --abort
            exit 1
          fi
          # Bot pushes can never carry workflow-file changes, so restore
          # fork-owned workflows to their pre-merge state before pushing
          # (same protection the main merge job applies).
          if ! git diff --quiet ORIG_HEAD HEAD -- .github/workflows; then
            git rm -r -q --ignore-unmatch .github/workflows
            git checkout ORIG_HEAD -- .github/workflows
            git commit --amend --no-edit
            echo "Restored fork workflow files after merge."
          fi

      - name: Push personal/main
        if: steps.merge.outputs.merged == 'true'
        run: git push origin HEAD:personal/main

      # Bot pushes never cascade into other workflows, so start the fork
      # desktop build explicitly. Human pushes to personal/main still build
      # through release-fork.yml's own push trigger; this only covers the bot.
      - name: Trigger fork desktop build
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-fork.yml --ref personal/main
